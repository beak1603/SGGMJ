name: Update organizer card 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply organizer card update
        run: python .github/update-organizer-card-20260823.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/update-organizer-card-20260823.py
          rm -f .github/workflows/update-organizer-card-20260823.yml
          rm -f .github/update-organizer-card-trigger-20260823.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "TOP100 버튼 제거 및 고세구 카드 상시 표시"
          git push
