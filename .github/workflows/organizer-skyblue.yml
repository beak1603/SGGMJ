name: Organizer skyblue gradient

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply organizer skyblue gradient
        run: python .github/organizer_skyblue_patch.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/organizer_skyblue_patch.py
          rm -f .github/workflows/organizer-skyblue.yml
          rm -f .github/organizer-skyblue-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "고세구 방송국 카드 하늘색 그라데이션 적용"
          git push
