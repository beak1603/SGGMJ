name: Site layout update 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply page update
        run: python .github/site_layout_update_20260823.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/site_layout_update_20260823.py
          rm -f .github/workflows/site-layout-update-20260823.yml
          rm -f .github/site-layout-update-trigger-20260823.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "커트라인 제거 및 최종 참가자 안내 레이아웃 수정"
          git push
