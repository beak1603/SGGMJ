name: Apply mobile touch drag

on:
  push:
    paths:
      - 'patch_mobile_touch_drag.py'
      - '.github/workflows/apply-mobile-touch-drag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_mobile_touch_drag.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Support mobile long-press drag and drop"
            git push
          fi
