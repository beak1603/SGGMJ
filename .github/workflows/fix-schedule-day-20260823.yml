name: Fix schedule weekday 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix schedule weekday
        run: python .github/fix_schedule_day_20260823.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/fix_schedule_day_20260823.py
          rm -f .github/workflows/fix-schedule-day-20260823.yml
          rm -f .github/fix-schedule-day-trigger-20260823.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "콘텐츠 일정 요일을 화요일로 수정"
          git push
