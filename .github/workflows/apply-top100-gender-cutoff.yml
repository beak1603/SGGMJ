name: Apply TOP100 gender cutoff

on:
  push:
    paths:
      - 'patch_top100_gender_cutoff.py'
      - '.github/workflows/apply-top100-gender-cutoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_top100_gender_cutoff.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add TOP100 gender quota cutoff lines"
            git push
          fi
