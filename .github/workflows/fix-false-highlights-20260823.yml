name: Fix false participant highlights 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix false highlights
        run: python .github/fix_false_highlights_20260823.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/fix_false_highlights_20260823.py
          rm -f .github/workflows/fix-false-highlights-20260823.yml
          rm -f .github/fix-false-highlights-trigger-20260823.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "춘빵이 김먕이 세이지 강조 색상 복구"
          git push
