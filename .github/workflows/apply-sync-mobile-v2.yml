name: Apply sync and mobile v2

on:
  push:
    paths:
      - 'patch_sync_mobile_v2.py'
      - '.github/workflows/apply-sync-mobile-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_sync_mobile_v2.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix shared gender sync and keep mobile two columns"
            git push
          fi
