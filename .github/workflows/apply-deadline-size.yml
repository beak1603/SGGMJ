name: Apply deadline size

on:
  push:
    paths:
      - '.github/workflows/apply-deadline-size.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_deadline_size.py
      - name: Commit site update
        run: |
          git config user.name "beak1603"
          git config user.email "beak1603@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase application deadline timer size"
          git push
