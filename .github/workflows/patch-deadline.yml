name: Patch deadline message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-deadline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update closed deadline message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_note = '            <span class="deadline-closed-note">합격자 발표는 22일(오늘) 예정입니다</span>\n'
          if old_note not in s:
              raise SystemExit('deadline announcement line not found')
          s = s.replace(old_note, '', 1)
          old_desktop = '''    .deadline-countdown.is-complete .deadline-closed-title {
              color: #d62f2f !important;
              font-size: 25px !important;'''
          new_desktop = '''    .deadline-countdown.is-complete .deadline-closed-title {
              color: #d62f2f !important;
              font-size: 34px !important;'''
          if old_desktop not in s:
              raise SystemExit('desktop closed-title style not found')
          s = s.replace(old_desktop, new_desktop, 1)
          old_mobile = '''      .deadline-countdown.is-complete .deadline-closed-title {
                font-size: 19px !important;
              }'''
          new_mobile = '''      .deadline-countdown.is-complete .deadline-closed-title {
                font-size: 26px !important;
              }'''
          if old_mobile not in s:
              raise SystemExit('mobile closed-title style not found')
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/patch-deadline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-deadline.yml
          git commit -m "Update closed application message"
          git push
