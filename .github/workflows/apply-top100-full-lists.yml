name: Apply TOP100 full lists

on:
  push:
    paths:
      - '.github/workflows/apply-top100-full-lists.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_top100_full_lists.py
      - name: Commit site update
        run: |
          git config user.name "beak1603"
          git config user.email "317630447+beak1603@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show full gender lists with TOP100 cutlines"
          git push
