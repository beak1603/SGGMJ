name: Apply admin HTTP fallback

on:
  push:
    paths:
      - '.github/workflows/apply-admin-http-fallback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_admin_http_fallback.py
      - name: Commit site update
        run: |
          git config user.name "beak1603"
          git config user.email "beak1603@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin login on HTTP custom domain"
          git push
