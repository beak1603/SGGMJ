name: Run refined final participant patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement patch
        run: python .github/refine_final_participants_patch.py
      - name: Commit result and clean up
        shell: bash
        run: |
          rm -f .github/workflows/refine-final-participants.yml
          rm -f .github/workflows/refine-final-participants-run.yml
          rm -f .github/refine_final_participants_patch.py
          rm -f .github/refine-final-participants-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "참가자 이름 유사 매칭 및 골드 강조 완화"
          git push
