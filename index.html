<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eaf7ff" />
  <meta name="color-scheme" content="only light" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="/favicon.ico?v=20260818-2" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260818-2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260818-2" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/beak1603/SGGMJ/main/favicon.png?mobile=20260818-2" crossorigin="anonymous" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260818-2" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/beak1603/SGGMJ/main/favicon.png?mobile=20260818-2" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://raw.githubusercontent.com/beak1603/SGGMJ/main/favicon.png?mobile=20260818-2" />
  <link rel="manifest" href="/site.webmanifest?v=20260818-2" />
  <title>스까묵자 배그</title>
  <style>
    :root {
      --bg: #f5fbff;
      --panel: #ffffff;
      --sky-50: #f2faff;
      --sky-100: #e2f4ff;
      --sky-200: #bfe8ff;
      --sky-300: #8fd8ff;
      --sky-500: #39aff0;
      --sky-600: #178ed0;
      --sky-700: #106c9f;
      --text: #152534;
      --muted: #667b8c;
      --line: #d9ebf5;
      --shadow: 0 12px 36px rgba(45, 120, 160, .10);
      --radius: 18px;
      --female-bg: #fff8fb;
      --female-head: #fff0f6;
      --female-line: #f2dce7;
      --male-bg: #f7fbff;
      --male-head: #eaf5ff;
      --male-line: #d7eafb;
    }

    * { box-sizing: border-box; }
    html { color-scheme: only light; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 0% 0%, rgba(72,184,246,.52) 0%, rgba(72,184,246,.22) 24%, rgba(72,184,246,0) 48%),
        radial-gradient(circle at 100% 8%, rgba(246,145,190,.42) 0%, rgba(246,145,190,.18) 25%, rgba(246,145,190,0) 49%),
        radial-gradient(circle at 50% 100%, rgba(50,190,220,.32) 0%, rgba(50,190,220,.10) 30%, rgba(50,190,220,0) 54%),
        linear-gradient(135deg, #e9f7ff 0%, #f7fbff 46%, #fff0f6 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      min-height: 100vh;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .wrap {
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 60px;
    }

    .hero {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px 28px 22px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      right: -100px;
      top: -120px;
      background: var(--sky-100);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--sky-700);
      background: var(--sky-100);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: clamp(25px, 4vw, 36px);
      line-height: 1.18;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .hero-meta {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      position: relative;
      z-index: 1;
    }

    .stat {
      min-width: 112px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      background: var(--sky-50);
      border-radius: 13px;
    }
    .stat .label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat .value { display:block; margin-top: 2px; font-size: 18px; font-weight: 900; }

    .toolbar {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .searchbox {
      position: relative;
      min-width: 0;
    }
    .searchbox input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: var(--text);
      transition: .18s ease;
    }
    .searchbox input:focus {
      border-color: var(--sky-300);
      box-shadow: 0 0 0 4px rgba(57,175,240,.10);
    }
    .searchicon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7d98aa;
      pointer-events: none;
    }

    .toggle {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .switch {
      width: 42px;
      height: 24px;
      padding: 3px;
      border-radius: 999px;
      background: #cfdde5;
      transition: .2s ease;
      display:flex;
      align-items:center;
    }
    .switch i {
      display:block;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
      transition: .2s ease;
    }
    .toggle[aria-pressed="true"] .switch { background: var(--sky-500); }
    .toggle[aria-pressed="true"] .switch i { transform: translateX(18px); }

    .linkbtn {
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 0 18px 0 0;
      border-radius: 13px;
      background: var(--sky-500);
      color: #fff;
      font-weight: 850;
      border: 1px solid var(--sky-500);
      white-space: nowrap;
    }

    .admin-btn {
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 16px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-weight: 850;
      white-space: nowrap;
    }
    .admin-btn:hover { background: var(--sky-50); color: var(--text); }
    .admin-btn.active {
      border-color: var(--sky-300);
      background: var(--sky-50);
      color: var(--sky-700);
    }

    .admin-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(21, 37, 52, .28);
      backdrop-filter: blur(3px);
    }
    .admin-modal.open { display: grid; }
    .admin-dialog {
      width: min(380px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(21, 37, 52, .20);
    }
    .admin-dialog h2 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: -.025em;
    }
    .admin-dialog p {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .admin-code-input {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
    }
    .admin-code-input:focus {
      border-color: var(--sky-300);
      box-shadow: 0 0 0 4px rgba(57,175,240,.10);
    }
    .admin-error {
      min-height: 18px;
      margin-top: 7px;
      color: #d62f2f;
      font-size: 11px;
      font-weight: 800;
    }
    .admin-dialog-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .admin-dialog-actions button {
      height: 38px;
      padding: 0 13px;
      border-radius: 10px;
      font-weight: 850;
    }
    .admin-cancel { border: 1px solid var(--line); background: #fff; color: var(--muted); }
    .admin-submit { border: 1px solid var(--sky-500); background: var(--sky-500); color: #fff; }

    .view-btn {
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-weight: 850;
      white-space: nowrap;
    }
    .view-btn:hover { background: var(--sky-50); color: var(--text); }
    .view-btn[aria-pressed="true"]:hover { filter: brightness(1.03); transform: translateY(-1px); }

    .is-hidden { display: none !important; }
    .stat.admin-alert {
      border-color: #ffd7b3;
      background: #fff9f2;
    }
    .stat.admin-alert .value { color: #dd6d1f; }
    .stat.admin-alert.alerting {
      box-shadow: 0 0 0 3px rgba(239, 135, 54, .09);
    }

    .status-right {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .last-updated {
      color:#587182;
      font-weight:800;
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }

    .statusbar {
      margin: 15px 2px 0;
      min-height: 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color: var(--muted);
      font-size: 12px;
    }
    .status-left { display:flex; align-items:center; gap:8px; min-width:0; }

    .comment-count-summary {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #526b7a;
    }
    .comment-count-summary .count-chip {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      white-space: nowrap;
    }
    .comment-count-summary strong {
      color: var(--text);
      font-weight: 900;
    }
    .comment-count-summary .excluded {
      border-color: #ffd2d2;
      background: #fff7f7;
      color: #b14545;
    }
    .comment-count-summary .excluded strong { color:#d62f2f; }

    .dot { width:7px; height:7px; border-radius:50%; background:#aebfc9; flex:0 0 auto; }
    .dot.live { background:#32bf72; box-shadow: 0 0 0 4px rgba(50,191,114,.10); }
    .dot.error { background:#e48787; }
    .refresh {
      border:0;
      background:transparent;
      color: var(--sky-700);
      font-weight:800;
      padding:4px 2px;
    }

    .content { margin-top: 16px; }
    .drag-hint {
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .split {
      display:grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 14px;
      /* 두 성별 보드의 높이를 동일하게 유지해, 긴 목록의 맨 아래 행에서도
         반대편 전체 높이가 드롭 영역으로 작동하도록 합니다. */
      align-items:stretch;
    }

    .board.drop-zone {
      height: 100%;
    }

    .board {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(45,120,160,.06);
    }


    .female-board {
      background: var(--female-bg);
      border-color: var(--female-line);
    }
    .female-board .board-head {
      background: linear-gradient(180deg, var(--female-head), #fff8fb);
      border-bottom-color: var(--female-line);
    }
    .female-board .rank-row {
      border-bottom-color: #f6e6ee;
    }
    .female-board .rank-row:hover {
      background: #fff2f7;
    }

    .male-board {
      background: var(--male-bg);
      border-color: var(--male-line);
    }
    .male-board .board-head {
      background: linear-gradient(180deg, var(--male-head), #f7fbff);
      border-bottom-color: var(--male-line);
    }
    .male-board .rank-row {
      border-bottom-color: #e4f0fa;
    }
    .male-board .rank-row:hover {
      background: #eef7ff;
    }

    .board-head {
      height: 62px;
      padding: 0 20px;
      background: linear-gradient(180deg, var(--sky-50), #fff);
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .board-title { display:flex; align-items:baseline; gap:8px; min-width:0; }
    .board-title strong { font-size: 16px; letter-spacing:-.02em; }
    .board-title span { color:var(--muted); font-size:12px; font-weight:750; }

    .rows { min-height: 90px; }
    .rank-row {
      min-height: 68px;
      display:grid;
      grid-template-columns: 48px 42px minmax(0,1fr) auto;
      align-items:center;
      gap:10px;
      padding: 0 17px;
      border-bottom: 1px solid #edf4f8;
      transition: background .15s ease;
    }
    .rank-row:last-child { border-bottom:0; }
    .rank-row:hover { background: #f8fcff; }
    /* 드래그 가능한 행도 hover 순간부터 일반 손가락 포인터를 사용합니다.
       grab/grabbing 커서는 OS/브라우저에 따라 테두리가 흐리게 보여 사용하지 않습니다. */
    .rank-row[draggable="true"] { cursor: default; }
    .rank-num {
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      color:#718796;
      font-size:13px;
      font-weight:900;
      background:#f3f7f9;
    }
    .rank-row.top1 .rank-num { background:#fff4c7; color:#9b6a00; }
    .rank-row.top2 .rank-num { background:#edf2f5; color:#596e7c; }
    .rank-row.top3 .rank-num { background:#f7e8dc; color:#9a6139; }

    .avatar-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 auto;
      border: 1px solid rgba(98, 134, 154, .18);
      background: #eef4f7;
      display: grid;
      place-items: center;
    }
    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #7b93a2;
      background: linear-gradient(145deg, #edf4f7, #f9fbfc);
      font-size: 14px;
      font-weight: 900;
    }

    .name {
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-weight:850;
      font-size: 15px;
      letter-spacing:-.015em;
    }
    .name-link {
      color: inherit;
      text-decoration: none;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .name-link:hover { color: var(--sky-700); text-decoration: underline; text-underline-offset: 3px; }
    .name-link:focus-visible { box-shadow: 0 0 0 3px rgba(57,175,240,.18); }
    .new-badge {
      display:inline-block;
      margin-left:7px;
      color:#e53935;
      font-size:11px;
      font-weight:950;
      letter-spacing:-.01em;
      vertical-align:1px;
    }
    .fresh-badge {
      display:inline-block;
      margin-left:7px;
      padding:2px 5px;
      border-radius:999px;
      background:#e6f5ff;
      color:#0d80bc;
      font-size:10px;
      font-weight:950;
      letter-spacing:-.01em;
      vertical-align:1px;
    }
    .rank-move {
      display:inline-flex;
      align-items:center;
      margin-left:7px;
      font-size:13px;
      line-height:1;
      font-weight:950;
      font-variant-numeric: tabular-nums;
      vertical-align:1px;
    }
    .rank-move.up { color:#0c8b56; }
    .rank-move.down { color:#cc4f55; }
    .undo-gender-btn {
      width:30px;
      height:30px;
      padding:0;
      display:grid;
      place-items:center;
      border:1px solid #dce8ee;
      border-radius:9px;
      background:rgba(255,255,255,.82);
      color:#708695;
      font-size:15px;
      font-weight:900;
      line-height:1;
    }
    .undo-gender-btn:hover { background:#fff; color:#d05a5a; border-color:#efcaca; }
    .rank-row.has-admin-action { grid-template-columns: 48px 42px minmax(0,1fr) auto 30px; }
    .single .rank-row.has-admin-action { grid-template-columns: 54px 42px minmax(0,1fr) auto 30px; }
    .likes {
      min-width: 88px;
      text-align:right;
      color:#2f6f92;
      font-size:18px;
      font-weight:950;
      font-variant-numeric: tabular-nums;
    }
    .likes .heart { color:#ef5f7c; margin-right:7px; font-size:20px; vertical-align:-1px; }

    .empty {
      padding: 34px 20px;
      text-align:center;
      color: var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .single { display:block; }
    .single .board { width:100%; }
    .single .rank-row { grid-template-columns: 54px 42px minmax(0,1fr) auto; min-height:68px; }

    .unknown-section {
      margin-top: 14px;
    }
    .unknown-section .board {
      border-style: dashed;
      box-shadow: none;
    }
    .unknown-section .board-head {
      background: linear-gradient(180deg, #f8fbfd, #fff);
    }
    .unknown-section .board-title strong {
      color: #506978;
    }
    .unknown-note {
      margin: 0;
      padding: 10px 17px;
      border-bottom: 1px solid #edf4f8;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      background: #fbfdfe;
    }

    .unknown-row {
      min-height: 68px;
      display:grid;
      grid-template-columns: 48px 42px minmax(0,1fr) auto auto;
      align-items:center;
      gap:10px;
      padding: 0 17px;
      border-bottom: 1px solid #edf4f8;
    }
    .unknown-row:last-child { border-bottom: 0; }
    .gender-actions { display:flex; gap:6px; }
    .gender-btn {
      height: 32px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--sky-200);
      background: #fff;
      color: var(--sky-700);
      font-size: 12px;
      font-weight: 850;
      transition: .15s ease;
    }
    .gender-btn:hover { background: var(--sky-50); border-color: var(--sky-300); }
    .manual-tools {
      margin-top: 10px;
      display:flex;
      justify-content:flex-end;
    }
    .reset-btn {
      border: 1px solid var(--line);
      background:#fff;
      color:var(--muted);
      border-radius:10px;
      padding:8px 11px;
      font-size:11px;
      font-weight:800;
    }
    .reset-btn:hover { background:#f8fcff; color:var(--text); }

    .skeleton-row {
      height:58px;
      padding:0 17px;
      display:grid;
      grid-template-columns:48px 42px 1fr 88px;
      align-items:center;
      gap:10px;
      border-bottom:1px solid #edf4f8;
    }
    .sk { height:13px; border-radius:999px; background:linear-gradient(90deg,#eef4f7 25%,#f8fbfc 37%,#eef4f7 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; }
    .sk.circle { width:34px; height:34px; border-radius:10px; }
    @keyframes shimmer { 0%{background-position:100% 0}100%{background-position:0 0} }



    /* Poster-style title inspired by the original content artwork */
    .poster-title {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      width: fit-content;
      margin: 0 0 8px;
      color: inherit;
      text-shadow: none;
    }
    .poster-title::after { display: none; }

    .poster-logo {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      min-width: 205px;
      min-height: 105px;
      padding: 12px 34px 10px 23px;
      overflow: hidden;
      transform: rotate(-1.3deg);
      clip-path: polygon(2% 11%, 13% 7%, 9% 0, 32% 5%, 47% 0, 63% 5%, 82% 1%, 79% 7%, 100% 4%, 94% 22%, 100% 29%, 95% 41%, 100% 49%, 92% 61%, 98% 70%, 91% 82%, 94% 92%, 72% 88%, 61% 100%, 45% 93%, 28% 99%, 17% 91%, 0 96%, 6% 79%, 1% 67%, 7% 55%, 1% 43%, 7% 31%, 0 22%);
      background:
        linear-gradient(165deg, rgba(68,177,237,.34) 0 7%, transparent 8% 18%, rgba(38,147,217,.24) 19% 25%, transparent 26% 100%),
        linear-gradient(135deg, #0a1520 0%, #102b41 46%, #0c1b2a 74%, #071018 100%);

    .reset-btn:active,

        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while (ascii.length % 64 - 56) ascii += '\x00';

      for (i = 0; i < ascii.length; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) throw new Error('Fallback SHA-256 only supports ASCII admin codes.');
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }

      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;

      let currentHash = hash.slice(0, 8);
      for (j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const oldHash = currentHash.slice(0);

        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = currentHash[0];
          const e = currentHash[4];
          const temp1 = currentHash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & currentHash[5]) ^ ((~e) & currentHash[6]))
            + k[i]
            + (w[i] = i < 16 ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & currentHash[1]) ^ (a & currentHash[2]) ^ (currentHash[1] & currentHash[2]));

          currentHash = [(temp1 + temp2) | 0].concat(currentHash);
          currentHash[4] = (currentHash[4] + temp1) | 0;
          currentHash.pop();
        }

        for (i = 0; i < 8; i++) currentHash[i] = (currentHash[i] + oldHash[i]) | 0;
      }

      let result = '';
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (currentHash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    async function sha256(text) {
      if (globalThis.crypto?.subtle && globalThis.TextEncoder) {
        const bytes = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return sha256Fallback(String(text));
    }

    async function submitAdminCode() {
      try {
        const enteredHash = await sha256(adminCodeInput.value);
        if (enteredHash === CONFIG.adminCodeHash) {
          state.adminCode = adminCodeInput.value;
          saveAdminCodeSession(state.adminCode);
          setAdminMode(true);
          closeAdminModal();
          syncAllLocalOverridesToCloud();
          if (state.comments.length) {
            syncSharedRankHistory().then(() => render());
          }
        } else {
          adminError.textContent = '관리자 코드가 올바르지 않습니다.';
          adminCodeInput.select();
        }
      } catch (err) {
        console.error('관리자 인증 처리 실패', err);
        adminError.textContent = '관리자 인증 처리 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.';
      }
    }

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function pick(obj, keys, fallback = '') {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null) return obj[key];
      }
      return fallback;
    }

    function asNumber(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      const n = Number(String(value ?? '').replace(/[^0-9.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeComment(raw) {
      const id = String(pick(raw, ['p_comment_no', 'pCommentNo', 'comment_no', 'commentNo', 'id'], ''));
      const userId = String(pick(raw, ['user_id', 'userId', 'bj_id', 'bjId', 'channel_id', 'channelId'], '')).trim();
      const nickname = String(pick(raw, ['user_nick', 'userNick', 'nickname', 'nick_name', 'user_name', 'name'], '알 수 없음')).trim();
      const text = String(pick(raw, ['comment', 'content', 'comment_content', 'commentContent', 'memo', 'text'], '')).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      const likes = asNumber(pick(raw, ['like_cnt', 'likeCnt', 'like_count', 'likeCount', 'up_cnt', 'upCnt', 'up_count', 'upCount', 'recommend_cnt', 'recommendCnt', 'recommend_count', 'recommendCount', 'like', 'up'], 0));
      const date = String(pick(raw, ['reg_date', 'regDate', 'created_at', 'createdAt'], ''));
      const replyCount = asNumber(pick(raw, [
        'c_comment_cnt', 'cCommentCnt', 'reply_cnt', 'replyCnt', 'reply_count', 'replyCount',
        'child_comment_cnt', 'childCommentCnt', 'sub_comment_cnt', 'subCommentCnt'
      ], 0));
      const profileImage = String(pick(raw, [
        'profile_image', 'profileImage', 'profile_img', 'profileImg',
        'user_profile_image', 'userProfileImage', 'user_profile_img', 'userProfileImg',
        'user_image', 'userImage', 'profile_url', 'profileUrl',
        'thumbnail', 'user_thumbnail', 'userThumbnail', 'bj_thumbnail', 'bjThumbnail'
      ], '')).trim();
      return { id, userId, nickname, text, likes, date, replyCount, profileImage, raw };
    }

    function applicantIdentity(item) {
      if (item.userId) return `uid:${item.userId.toLocaleLowerCase('en')}`;
      return `nick:${item.nickname.normalize('NFKC').toLocaleLowerCase('ko')}`;
    }

    function itemKey(item) {
      return applicantIdentity(item);
    }

    function aggregateApplicants(items) {
      const groups = new Map();
      for (const item of items) {
        const key = applicantIdentity(item);
        const prev = groups.get(key);
        if (!prev) {
          groups.set(key, {
            ...item,
            texts: item.text ? [item.text] : [],
            commentIds: item.id ? [item.id] : [],
            commentCount: 1,
            firstDate: item.date || ''
          });
          continue;
        }

        prev.commentCount += 1;
        if (item.date && (!prev.firstDate || item.date < prev.firstDate)) prev.firstDate = item.date;
        if (item.text && !prev.texts.includes(item.text)) prev.texts.push(item.text);
        if (item.id && !prev.commentIds.includes(item.id)) prev.commentIds.push(item.id);
        if (item.likes > prev.likes || (item.likes === prev.likes && item.date > prev.date)) {
          prev.id = item.id;
          prev.likes = item.likes;
          prev.date = item.date;
          prev.raw = item.raw;
          if (item.nickname) prev.nickname = item.nickname;
          if (item.userId) prev.userId = item.userId;
          if (item.profileImage) prev.profileImage = item.profileImage;
        } else if (!prev.profileImage && item.profileImage) {
          prev.profileImage = item.profileImage;
        }
      }
      return [...groups.values()].map(item => ({ ...item, text: item.texts.join(' | ') }));
    }

    function commentUrl(item) {
      const base = `https://www.sooplive.com/station/${CONFIG.channelId}/post/${CONFIG.postId}`;
      return item?.id ? `${base}#comment_noti${encodeURIComponent(item.id)}` : base;
    }

    function loadManualGenderOverrides() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return saved && typeof saved === 'object' ? saved : {};
      } catch {
        return {};
      }
    }

    function saveManualGenderOverrides() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.manualGenderOverrides));
      } catch (err) {
        console.warn('수동 성별 분류 저장 실패', err);
      }
    }

    async function fetchCloudGenderMap() {
      const response = await fetch(
        `${CONFIG.supabaseUrl}/rest/v1/gender_overrides?select=applicant_key,gender,nickname,new_until`,
        {
          headers: { apikey: CONFIG.supabasePublishableKey },
          cache: 'no-store'
        }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rows = await response.json();
      const cloud = {};
      const sharedNew = new Set();
      const sharedNewVersions = {};
      const seenNew = loadSeenNewVersions();
      const now = Date.now();
      for (const row of Array.isArray(rows) ? rows : []) {
        const key = String(row?.applicant_key || '').trim();
        const gender = String(row?.gender || '').trim();
        if (key && (gender === 'female' || gender === 'male' || gender === 'unknown')) cloud[key] = gender;
        const newUntil = row?.new_until ? Date.parse(row.new_until) : 0;
        if (key && Number.isFinite(newUntil) && newUntil > now) {
          sharedNewVersions[key] = newUntil;
          if (newUntil > Number(seenNew[key] || 0)) sharedNew.add(key);
        }
      }
      state.sharedNewApplicants = sharedNew;
      state.sharedNewVersions = sharedNewVersions;
      return cloud;
    }

    async function loadCloudGenderOverrides() {
      try {
        const cloud = await fetchCloudGenderMap();
        // 서버 값을 우선해서 PC/모바일/다른 브라우저가 같은 분류를 표시합니다.
        state.manualGenderOverrides = { ...state.manualGenderOverrides, ...cloud };
        saveManualGenderOverrides();
        if (!state.loading) render();
        return cloud;
      } catch (err) {
        console.warn('공용 성별 분류 불러오기 실패', err);
        return null;
      }
    }

    async function syncGenderOperation(payload) {
      if (!state.isAdmin || !state.adminCode) return false;
      try {
        const operation = String(payload?.operation || '');
        let rpcName = '';
        let rpcBody = {};

        if (operation === 'set') {
          rpcName = 'set_gender_override';
          rpcBody = {
            p_admin_code: state.adminCode,
            p_keys: Array.isArray(payload?.keys) ? payload.keys : [],
            p_gender: String(payload?.gender || ''),
            p_nickname: String(payload?.nickname || ''),
            p_mark_new: Boolean(payload?.markNew)
          };
        } else if (operation === 'reset') {
          rpcName = 'reset_gender_overrides';
          rpcBody = { p_admin_code: state.adminCode };
        } else {
          return false;
        }

        const response = await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${rpcName}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: CONFIG.supabasePublishableKey
          },
          cache: 'no-store',
          body: JSON.stringify(rpcBody)
        });
        if (!response.ok) {
          const detail = await response.text().catch(() => '');
          throw new Error(`HTTP ${response.status}${detail ? ` · ${detail}` : ''}`);
        }
        return true;
      } catch (err) {
        console.warn('성별 분류 동기화 실패', err);
        return false;
      }
    }

    async function syncGenderForItem(item, gender, markNew = false) {
      const keys = manualGenderKeys(item);
      if (!keys.length) return false;
      return syncGenderOperation({ operation: 'set', keys, gender, nickname: item?.nickname || '', markNew });
    }

    async function syncStandaloneGenderKey(key, gender, nickname = '') {
      if (!key) return false;
      return syncGenderOperation({ operation: 'set', keys: [key], gender, nickname });
    }

    async function syncAllLocalOverridesToCloud() {
      if (!state.isAdmin || !state.adminCode) return;
      try {
        const cloud = await fetchCloudGenderMap();
        // 기존 PC의 분류는 최초 1회 클라우드로 옮기되, 이미 서버에 있는 값은 덮어쓰지 않습니다.
        for (const [key, gender] of Object.entries(state.manualGenderOverrides)) {
          if (key in cloud) continue;
          if (gender !== 'female' && gender !== 'male' && gender !== 'unknown') continue;
          await syncStandaloneGenderKey(key, gender);
        }
        await loadCloudGenderOverrides();
      } catch (err) {
        console.warn('기존 수동 분류 이전 실패', err);
      }
    }

    function manualGenderKeys(item) {
      const keys = [];
      if (item?.userId) keys.push(`uid:${String(item.userId).toLocaleLowerCase('en')}`);
      if (item?.nickname) keys.push(`nick:${String(item.nickname).normalize('NFKC').toLocaleLowerCase('ko')}`);
      return [...new Set(keys)];
    }

    function legacyManualGenderKeys(item) {
      const keys = [];
      if (item?.userId) {
        keys.push(String(item.userId));
        keys.push(String(item.userId).toLocaleLowerCase('en'));
      }
      if (item?.nickname) {
        keys.push(String(item.nickname));
        keys.push(String(item.nickname).normalize('NFKC').toLocaleLowerCase('ko'));
      }
      return [...new Set(keys.filter(Boolean))];
    }

    function getManualGender(item) {
      for (const key of [...manualGenderKeys(item), ...legacyManualGenderKeys(item)]) {
        const value = state.manualGenderOverrides[key];
        if (value === 'female' || value === 'male' || value === 'unknown') return value;
      }
      return '';
    }

    function setManualGenderForItem(item, gender) {
      if (!item) return;
      for (const key of manualGenderKeys(item)) state.manualGenderOverrides[key] = gender;
    }

    function reconcileManualGenderOverrides(items) {
      let changed = false;
      for (const item of items) {
        const value = getManualGender(item);
        if (!value) continue;
        for (const key of manualGenderKeys(item)) {
          if (state.manualGenderOverrides[key] !== value) {
            state.manualGenderOverrides[key] = value;
            changed = true;
          }
        }
      }
      if (changed) saveManualGenderOverrides();
    }

    function classifyGender(item) {
      const manual = getManualGender(item);
      if (manual) return manual;
      if (CONFIG.genderOverrides[item.id]) return CONFIG.genderOverrides[item.id];

      // 저장된 분류가 없는 신규 신청자는 댓글 문구로 성별을 추측하지 않습니다.
      return 'unknown';
    }

    function isManualGender(item) {
      return Boolean(getManualGender(item));
    }

    function compareRankItems(a, b) {
      if (b.likes !== a.likes) return b.likes - a.likes;
      const ad = String(a.firstDate || a.date || '');
      const bd = String(b.firstDate || b.date || '');
      if (ad && bd && ad !== bd) return ad.localeCompare(bd);
      if (ad && !bd) return -1;
      if (!ad && bd) return 1;
      return a.nickname.localeCompare(b.nickname, 'ko');
    }

    function rankedItems(items) {
      return [...items]
        .sort(compareRankItems)
        .map((item, index) => ({ item, rank: index + 1 }));
    }

    function fullRankMap(scope = 'overall') {
      const tagged = state.comments.map(x => ({ ...x, gender: classifyGender(x) }));
      let source = tagged;
      if (scope === 'female') source = tagged.filter(x => x.gender === 'female');
      else if (scope === 'male') source = tagged.filter(x => x.gender === 'male');
      else if (scope === 'unknown') source = tagged.filter(x => x.gender === 'unknown');

      const map = new Map();
      for (const { item, rank } of rankedItems(source)) map.set(itemKey(item), rank);
      return map;
    }

    function takeTopRanks(items, limit = 99) {
      const sorted = [...items].sort(compareRankItems);
      if (!state.top10) return sorted;
      return sorted.slice(0, limit);
    }

    function buildRankMaps(comments) {
      const tagged = comments.map(x => ({ ...x, gender: classifyGender(x) }));
      const build = list => {
        const map = {};
        for (const { item, rank } of rankedItems(list)) map[itemKey(item)] = rank;
        return map;
      };
      return {
        overall: build(tagged),
        female: build(tagged.filter(x => x.gender === 'female')),
        male: build(tagged.filter(x => x.gender === 'male'))
      };
    }

    function emptyRankGroups() {
      return { overall: {}, female: {}, male: {} };
    }

    function sanitizeRankGroups(value) {
      const result = emptyRankGroups();
      if (!value || typeof value !== 'object') return result;
      for (const scope of Object.keys(result)) {
        const source = value[scope];
        if (!source || typeof source !== 'object') continue;
        for (const [key, rawValue] of Object.entries(source)) {
          const number = Number(rawValue);
          if (key && Number.isFinite(number) && number !== 0) result[scope][key] = number;
        }
      }
      return result;
    }

    function applySharedRankHistory(row) {
      state.rankChanges = sanitizeRankGroups(row?.rank_changes);
      state.rankChangeExpires = sanitizeRankGroups(row?.rank_expires_at);
      try {
        localStorage.removeItem('soop-rank-history-v1');
      } catch {}
    }

    async function fetchSharedRankHistory() {
      const response = await fetch(
        `${CONFIG.supabaseUrl}/rest/v1/rank_sync_state?select=rank_changes,rank_expires_at&id=eq.1`,
        {
          headers: { apikey: CONFIG.supabasePublishableKey },
          cache: 'no-store'
        }
      );
      if (!response.ok) throw new Error(`공용 순위 기록 응답 오류 (${response.status})`);
      const rows = await response.json();
      const row = Array.isArray(rows) ? rows[0] : null;
      applySharedRankHistory(row || {});
      return Boolean(row);
    }

    async function syncSharedRankHistory() {
      try {
        const response = await fetch(`${CONFIG.supabaseUrl}/functions/v1/sync-ranks`, {
          method: 'POST',
          headers: {
            apikey: CONFIG.supabasePublishableKey,
            'Content-Type': 'application/json'
          },
          body: '{}',
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`공용 순위 자동 갱신 오류 (${response.status})`);
        const payload = await response.json();
        applySharedRankHistory(payload || {});
        return true;
      } catch (err) {
        console.warn('공용 순위 자동 갱신 실패', err);
      }

      try {
        return await fetchSharedRankHistory();
      } catch (err) {
        // 공용 순위 기록 오류가 신청자 목록 전체를 가리지 않도록 분리합니다.
        console.warn('공용 순위 기록 불러오기 실패', err);
        return false;
      }
    }

    function extractItems(payload) {
      if (!payload) return [];
      if (Array.isArray(payload)) return payload;
      const candidates = [
        payload.data,
        payload.comments,
        payload.comment,
        payload.list,
        payload.result?.data,
        payload.result?.comments,
        payload.result?.list,
        payload.data?.comments,
        payload.data?.list
      ];
      return candidates.find(Array.isArray) || [];
    }

    function getLastPage(payload, page, itemCount) {
      const candidates = [
        payload?.meta?.last_page,
        payload?.meta?.lastPage,
        payload?.pagination?.last_page,
        payload?.pagination?.lastPage,
        payload?.data?.meta?.last_page,
        payload?.data?.meta?.lastPage,
        payload?.last_page,
        payload?.lastPage
      ];
      for (const v of candidates) {
        const n = asNumber(v);
        if (n > 0) return n;
      }
      // 페이지 정보가 없다면 빈 페이지가 나올 때까지 한 번 더 시도하도록 보수적으로 처리.
      return itemCount === 0 ? page : page + 1;
    }

    function apiUrls(page, cacheBust = Date.now()) {
      // 매 갱신마다 쿼리값을 바꿔 브라우저/CDN 캐시를 우회합니다.
      const urls = [
        `https://chapi.sooplive.co.kr/api/${CONFIG.channelId}/title/${CONFIG.postId}/comment?page=${page}&orderby=reg_date&_=${cacheBust}`,
        `https://api-channel.sooplive.com/v1.1/channel/${CONFIG.channelId}/post/${CONFIG.postId}/comment?page=${page}&orderBy=reg_date&commentNo=0&_=${cacheBust}`
      ];
      if (!CONFIG.proxyBase) return urls;
      return urls.map(target => CONFIG.proxyBase.replace(/\/$/, '') + '?url=' + encodeURIComponent(target));
    }

    async function fetchPage(page, cacheBust) {
      let lastError = null;
      for (const url of apiUrls(page, cacheBust)) {
        try {
          const res = await fetch(url, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            headers: { 'Accept': 'application/json, text/plain, */*' }
          });
          if (!res.ok) throw new Error(`SOOP API 응답 오류 (${res.status})`);
          const json = await res.json();
          if (extractItems(json).length || page === 1) return json;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('SOOP 댓글 API에 연결하지 못했습니다.');
    }

    async function loadComments(options = {}) {
      const { silent = false } = options;
      const seq = ++state.loadSeq;
      const cacheBust = Date.now();
      state.loading = true;
      state.error = null;
      if (!silent && state.comments.length === 0) renderLoading();
      setStatus('loading', silent ? '최신 댓글과 좋아요 수를 다시 확인하는 중입니다.' : 'SOOP 댓글 데이터를 불러오는 중입니다.');

      try {
        const previousKeys = state.comments.length ? new Set(state.comments.map(itemKey)) : null;
        const sharedRankPromise = syncSharedRankHistory();
        const collected = [];
        let lastPage = 1;

        for (let page = 1; page <= Math.min(lastPage, CONFIG.maxPages); page++) {
          const payload = await fetchPage(page, `${cacheBust}-${page}`);
          const items = extractItems(payload);
          collected.push(...items);
          lastPage = Math.min(getLastPage(payload, page, items.length), CONFIG.maxPages);
          if (items.length === 0) break;
        }

        if (seq !== state.loadSeq) return;

        // 댓글 ID 중복 제거 후, SOOP user_id 기준으로 동일 신청자를 한 명으로 합칩니다.
        const commentMap = new Map();
        for (const raw of collected) {
          const item = normalizeComment(raw);
          const key = item.id || `${item.userId}|${item.nickname}|${item.date}|${item.text}`;
          if (!commentMap.has(key)) commentMap.set(key, item);
        }
        const uniqueComments = [...commentMap.values()];
        const applicants = aggregateApplicants(uniqueComments);

        state.rawCommentCount = uniqueComments.length;
        state.excludedCommentCount = uniqueComments.reduce((sum, item) => sum + Math.max(0, asNumber(item.replyCount)), 0);
        state.postCommentCount = state.rawCommentCount + state.excludedCommentCount;
        state.comments = applicants.sort(compareRankItems);
        await loadCloudGenderOverrides();
        if (seq !== state.loadSeq) return;
        reconcileManualGenderOverrides(state.comments);
        if (state.isAdmin && state.adminCode) syncAllLocalOverridesToCloud();
        if (previousKeys) {
          for (const item of state.comments) {
            const key = itemKey(item);
            if (!previousKeys.has(key)) state.newApplicants.add(key);
          }
        }
        await sharedRankPromise;
        if (seq !== state.loadSeq) return;
        state.updatedAt = new Date();
        state.loading = false;
        if (lastUpdatedText) lastUpdatedText.textContent = `최근 갱신 ${formatTime(state.updatedAt)}`;
        render();

        setStatus('live', '');
      } catch (err) {
        if (seq !== state.loadSeq) return;
        console.error(err);
        state.loading = false;
        state.error = err;
        if (state.comments.length === 0) {
          state.comments = [];
          render();
        }
        setStatus('error', 'SOOP 댓글 최신 데이터 호출에 실패했습니다. 잠시 후 자동으로 다시 시도하거나 새로고침을 눌러 주세요.');
      }
    }

    function setStatus(type, message) {
      statusDot.className = 'dot' + (type === 'live' ? ' live' : type === 'error' ? ' error' : '');
      statusText.textContent = message;
      statusText.closest('.status-left')?.classList.toggle('is-hidden', type === 'live' && !message);
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(date);
    }

    function filteredBase() {
      const q = state.query.trim().toLocaleLowerCase('ko');
      if (!q) return state.comments;
      return state.comments.filter(x => x.nickname.toLocaleLowerCase('ko').includes(q));
    }

    function safeImageUrl(value) {
      const url = String(value || '').trim();
      if (!url) return '';
      if (/^https?:\/\//i.test(url)) return url;
      if (url.startsWith('//')) return 'https:' + url;
      return '';
    }

    function stationProfileUrl(item, ext = 'jpg') {
      const id = String(item.userId || '').trim();
      if (!id) return '';
      const bucket = id.slice(0, 2).toLowerCase();
      return `https://stimg.sooplive.com/LOGO/${encodeURIComponent(bucket)}/${encodeURIComponent(id)}/${encodeURIComponent(id)}.${ext}`;
    }

    function avatarHtml(item) {
      const rawImage = safeImageUrl(item.profileImage);
      const jpgFallback = stationProfileUrl(item, 'jpg');
      const webpFallback = stationProfileUrl(item, 'webp');
      const imageUrl = rawImage || jpgFallback || webpFallback;
      const initial = esc((item.nickname || '?').trim().charAt(0) || '?');

      if (!imageUrl) {
        return `<div class="avatar-wrap" aria-hidden="true"><div class="avatar-fallback">${initial}</div></div>`;
      }

      const fallbackAttr = webpFallback && imageUrl !== webpFallback
        ? ` data-fallback-src="${esc(webpFallback)}"`
        : '';

      return `<div class="avatar-wrap">
        <img class="avatar" src="${esc(imageUrl)}"${fallbackAttr} alt="" loading="lazy" referrerpolicy="no-referrer"
          onerror="if(this.dataset.fallbackSrc){const u=this.dataset.fallbackSrc;delete this.dataset.fallbackSrc;this.src=u}else{this.style.display='none';this.nextElementSibling.style.display='grid'}">
        <div class="avatar-fallback" style="display:none">${initial}</div>
      </div>`;
    }

    function nameHtml(item) {
      const label = esc(item.nickname);
      return `<span class="name-link">${label}</span>`;
    }

    function badgeHtml(item) {
      const key = itemKey(item);
      const sharedNew = manualGenderKeys(item).some(k => state.sharedNewApplicants.has(k));
      const dragged = (state.newDraggedApplicants.has(key) || sharedNew) ? `<span class="new-badge">NEW!</span>` : '';
      const fresh = state.newApplicants.has(key) ? `<span class="fresh-badge">신규</span>` : '';
      return dragged + fresh;
    }

    function rankMoveHtml(item, scope) {
      const key = itemKey(item);
      const delta = state.rankChanges?.[scope]?.[key] || 0;
      const expiresAt = state.rankChangeExpires?.[scope]?.[key] || 0;
      if (!delta || expiresAt <= Date.now()) return '';
      const cls = delta > 0 ? 'up' : 'down';
      const arrow = delta > 0 ? '▲' : '▼';
      return `<span class="rank-move ${cls}" title="최근 확인된 순위 변동 · 30분 동안 표시">${arrow}${Math.abs(delta)}</span>`;
    }

    function rowHtml(item, rank, draggable = false, scope = 'overall', cutoffAfter = false) {
      const topClass = rank <= 3 ? ` top${rank}` : '';
      const dragAttrs = draggable ? ` draggable="true" data-drag-key="${esc(itemKey(item))}"` : '';
      const undo = state.isAdmin && isManualGender(item)
        ? `<button class="undo-gender-btn" type="button" draggable="false" data-unclassify="${esc(itemKey(item))}" title="미확인으로 되돌리기" aria-label="${esc(item.nickname)} 미확인으로 되돌리기">↩</button>`
        : '';
      const actionClass = undo ? ' has-admin-action' : '';
      const cutoffClass = cutoffAfter ? ' top100-cutoff-row' : '';
      return `<div class="rank-row${topClass}${actionClass}${cutoffClass}"${dragAttrs} data-comment-url="${esc(commentUrl(item))}" role="link" tabindex="0">
        <div class="rank-num">${rank}</div>
        ${avatarHtml(item)}
        <div class="name" title="${esc(item.nickname)}">${nameHtml(item)}${badgeHtml(item)}${rankMoveHtml(item, scope)}</div>
        <div class="likes"><span class="heart">♥</span>${item.likes.toLocaleString()}</div>
        ${undo}
      </div>`;
    }

    function unknownRowHtml(item, rank) {
      const key = esc(itemKey(item));
      const actions = state.isAdmin ? `<div class="gender-actions" aria-label="${esc(item.nickname)} 성별 지정">
          <button class="gender-btn" type="button" data-manual-gender="female" data-item-key="${key}">여자</button>
          <button class="gender-btn" type="button" data-manual-gender="male" data-item-key="${key}">남자</button>
        </div>` : '';
      return `<div class="unknown-row" data-comment-url="${esc(commentUrl(item))}" role="link" tabindex="0">
        <div class="rank-num">${rank}</div>
        ${avatarHtml(item)}
        <div class="name" title="${esc(item.nickname)}">${nameHtml(item)}${badgeHtml(item)}</div>
        <div class="likes"><span class="heart">♥</span>${item.likes.toLocaleString()}</div>
        ${actions}
      </div>`;
    }

    function unknownBoardHtml(items, emptyMessage) {
      const totalCount = items.length;
      const isSearch = Boolean(state.query.trim());
      const rankMap = isSearch ? fullRankMap('unknown') : null;
      const visible = isSearch && state.top10
        ? [...items].filter(item => (rankMap.get(itemKey(item)) || Infinity) <= 100).sort(compareRankItems)
        : takeTopRanks(items);
      const rankedVisible = isSearch
        ? [...visible].sort(compareRankItems).map(item => ({ item, rank: rankMap.get(itemKey(item)) || 0 }))
        : rankedItems(visible);
      const rows = rankedVisible.length ? rankedVisible.map(({ item, rank }) => unknownRowHtml(item, rank)).join('') : `<div class="empty">${esc(emptyMessage)}</div>`;
      const manualCount = state.comments.filter(isManualGender).length;
      return `<section class="board">
        <div class="board-head">
          <div class="board-title"><strong>신규 신청자</strong><span>${totalCount.toLocaleString()}명</span></div>
          <div class="board-title"><span>${state.top10 ? 'TOP 100 · ' : ''}좋아요순</span></div>
        </div>
        ${state.isAdmin ? `<p class="unknown-note">신규 신청자를 여자 또는 남자로 분류하면 즉시 해당 랭킹으로 이동합니다.</p>` : ''}
        <div class="rows">${rows}</div>
        ${state.isAdmin && manualCount ? `<div class="manual-tools"><button id="resetManualGender" class="reset-btn" type="button">수동 분류 초기화 (${manualCount})</button></div>` : ''}
      </section>`;
    }

    function boardHtml(title, items, emptyMessage, genderDrop = '', scope = 'overall', cutoffRank = 0) {
      const totalCount = items.length;
      const isSearch = Boolean(state.query.trim());
      const rankMap = isSearch ? fullRankMap(scope) : null;
      const visible = isSearch && state.top10
        ? [...items].filter(item => (rankMap.get(itemKey(item)) || Infinity) <= 100).sort(compareRankItems)
        : [...items].sort(compareRankItems);
      const displayCount = totalCount;
      const genderClass = genderDrop === 'female' ? ' female-board' : genderDrop === 'male' ? ' male-board' : '';
      const dropAttrs = genderDrop ? ` data-gender-drop="${genderDrop}" class="board drop-zone${genderClass}"` : ' class="board"';
      const draggable = Boolean(genderDrop) && state.isAdmin;
      const rankedVisible = isSearch
        ? [...visible].sort(compareRankItems).map(item => ({ item, rank: rankMap.get(itemKey(item)) || 0 }))
        : rankedItems(visible);
      const lastCutoffIndex = cutoffRank > 0 && rankedVisible.length
        ? Math.min(cutoffRank, rankedVisible.length) - 1
        : -1;
      const rows = rankedVisible.length ? rankedVisible.map(({ item, rank }, index) => {
        const row = rowHtml(item, rank, draggable, scope, index === lastCutoffIndex);
        const cutoffLabel = index === lastCutoffIndex
          ? `<div class="top100-cutoff-label" aria-label="커트라인"><span>커트라인</span></div>`
          : '';
        return row + cutoffLabel;
      }).join('') : `<div class="empty">${esc(emptyMessage)}</div>`;
      return `<section${dropAttrs}>
        <div class="board-head">
          <div class="board-title"><strong>${esc(title)}</strong><span>${displayCount.toLocaleString()}명</span></div>
          <div class="board-title"><span>${state.top10 ? 'TOP 100 · ' : ''}좋아요순</span></div>
        </div>
        <div class="rows">${rows}</div>
      </section>`;
    }

    function renderLoading() {
      const skeleton = Array.from({length:7}, () => `<div class="skeleton-row"><div class="sk circle"></div><div class="sk circle" style="border-radius:50%"></div><div class="sk"></div><div class="sk"></div></div>`).join('');
      contentEl.innerHTML = `<div class="split"><section class="board female-board"><div class="board-head"><div class="board-title"><strong>여자 신청자</strong></div></div>${skeleton}</section><section class="board male-board"><div class="board-head"><div class="board-title"><strong>남자 신청자</strong></div></div>${skeleton}</section></div>`;
    }

    function render() {
      if (postCommentCountEl) postCommentCountEl.textContent = state.postCommentCount.toLocaleString();
      if (applicationCommentCountEl) applicationCommentCountEl.textContent = state.rawCommentCount.toLocaleString();
      if (excludedCommentCountEl) excludedCommentCountEl.textContent = state.excludedCommentCount.toLocaleString();

      const all = filteredBase();
      const tagged = all.map(x => ({...x, gender: classifyGender(x)}));
      const female = tagged.filter(x => x.gender === 'female').sort(compareRankItems);
      const male = tagged.filter(x => x.gender === 'male').sort(compareRankItems);
      const unknown = tagged.filter(x => x.gender === 'unknown').sort(compareRankItems);

      const fullTagged = state.comments.map(x => ({...x, gender: classifyGender(x)}));
      const fullFemaleCount = fullTagged.filter(x=>x.gender==='female').length;
      const fullMaleCount = fullTagged.filter(x=>x.gender==='male').length;
      const fullUnknownCount = fullTagged.filter(x=>x.gender==='unknown').length;

      // TOP 100 selection guideline: aim for up to 50 men, with the remaining slots assigned to women.
      // If there are fewer than 50 male applicants, the shortage is added to the female cutoff.
      const maleTop100Cutoff = Math.min(50, fullMaleCount);
      const femaleTop100Cutoff = Math.min(100, 100 - maleTop100Cutoff);
      const showGenderCutoff = state.top10 && state.splitGender && !state.query.trim();
      $('#totalCount').textContent = state.comments.length.toLocaleString();
      $('#femaleCount').textContent = fullFemaleCount.toLocaleString();
      $('#maleCount').textContent = fullMaleCount.toLocaleString();
      if (unknownCountEl) unknownCountEl.textContent = fullUnknownCount.toLocaleString();
      if (unknownAdminStat) {
        unknownAdminStat.classList.toggle('is-hidden', !state.isAdmin);
        unknownAdminStat.classList.toggle('alerting', state.isAdmin && fullUnknownCount > 0);
      }

      if (state.error) {
        contentEl.innerHTML = `<section class="board"><div class="empty"><strong>댓글 데이터를 표시할 수 없습니다.</strong><br>브라우저에서 SOOP 공개 댓글 API 호출이 차단됐거나 일시적인 오류가 발생했습니다.<br>상단의 <b>새로고침</b> 버튼으로 다시 시도할 수 있습니다.</div></section>`;
        return;
      }

      const unknownBoard = `<div class="unknown-section">
        ${unknownBoardHtml(unknown, state.query ? '검색 결과가 없습니다.' : '신규 신청자가 없습니다.')}
      </div>`;

      if (state.splitGender) {
        const dragHint = state.isAdmin ? `<p class="drag-hint">PC는 드래그 · 모바일은 신청자를 약 0.5초 꾹 누른 뒤 여자/남자 칸으로 옮겨 놓으면 저장됩니다.</p>` : '';
        contentEl.innerHTML = `${dragHint}<div class="split">
          ${boardHtml('여자 신청자', female, state.query ? '검색 결과가 없습니다.' : '여자로 분류된 신청자가 없습니다.', 'female', 'female', showGenderCutoff ? femaleTop100Cutoff : 0)}
          ${boardHtml('남자 신청자', male, state.query ? '검색 결과가 없습니다.' : '남자로 분류된 신청자가 없습니다.', 'male', 'male', showGenderCutoff ? maleTop100Cutoff : 0)}
        </div>${unknownBoard}`;
      } else {
        const overallCutoff = state.top10 && !state.query.trim() ? 100 : 0;
        contentEl.innerHTML = `<div class="single">${boardHtml('전체 신청자', tagged.sort(compareRankItems), state.query ? '검색 결과가 없습니다.' : '신청 댓글이 없습니다.', '', 'overall', overallCutoff)}</div>${unknownBoard}`;
      }
    }

    toggleEl.addEventListener('click', () => {
      state.splitGender = !state.splitGender;
      toggleEl.setAttribute('aria-pressed', String(state.splitGender));
      toggleText.textContent = state.splitGender ? 'ON' : 'OFF';
      render();
    });

    top10Toggle.addEventListener('click', () => {
      state.top10 = !state.top10;
      top10Toggle.setAttribute('aria-pressed', String(state.top10));
      top100ToggleText.textContent = state.top10 ? 'ON' : 'OFF';
      document.body.classList.toggle('top100-mode', state.top10);
      render();
    });

    searchInput.addEventListener('input', (e) => {
      state.query = e.target.value;
      render();
    });

    $('#refreshBtn').addEventListener('click', () => {
      dismissCurrentNewBadges(true);
      loadComments({ silent: state.comments.length > 0 });
      loadCloudGenderOverrides();
    });

    contentEl.addEventListener('click', (e) => {
      const rowLink = e.target.closest('[data-comment-url]');
      if (rowLink && !e.target.closest('button')) {
        const url = rowLink.dataset.commentUrl || '';
        if (url) {
          window.open(url, '_blank', 'noopener,noreferrer');
          return;
        }
      }

      const unclassifyBtn = e.target.closest('[data-unclassify]');
      if (unclassifyBtn) {
        if (!state.isAdmin) return;
        const key = unclassifyBtn.dataset.unclassify;
        if (key) {
          const item = state.comments.find(x => itemKey(x) === key || manualGenderKeys(x).includes(key));
          if (item) setManualGenderForItem(item, 'unknown');
          else state.manualGenderOverrides[key] = 'unknown';
          saveManualGenderOverrides();
          if (item) syncGenderForItem(item, 'unknown');
          else syncStandaloneGenderKey(key, 'unknown');
          render();
        }
        return;
      }

      const genderBtn = e.target.closest('[data-manual-gender]');
      if (genderBtn) {
        if (!state.isAdmin) return;
        const key = genderBtn.dataset.itemKey;
        const gender = genderBtn.dataset.manualGender;
        if (key && (gender === 'female' || gender === 'male')) {
          const item = state.comments.find(x => itemKey(x) === key || manualGenderKeys(x).includes(key));
          if (item) setManualGenderForItem(item, gender);
          else state.manualGenderOverrides[key] = gender;
          saveManualGenderOverrides();
          if (item) syncGenderForItem(item, gender);
          else syncStandaloneGenderKey(key, gender);
          render();
        }
        return;
      }

      if (e.target.closest('#resetManualGender')) {
        if (!state.isAdmin) return;
        state.manualGenderOverrides = {};
        saveManualGenderOverrides();
        syncGenderOperation({ operation: 'reset' });
        render();
      }
    });



    contentEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('button')) return;
      const rowLink = e.target.closest('[data-comment-url]');
      if (!rowLink) return;
      const url = rowLink.dataset.commentUrl || '';
      if (!url) return;
      e.preventDefault();
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    let draggedKey = '';

    contentEl.addEventListener('dragstart', (e) => {
      if (!state.isAdmin) { e.preventDefault(); return; }
      if (e.target.closest('button, a')) { e.preventDefault(); return; }
      const row = e.target.closest('[data-drag-key]');
      if (!row) return;
      draggedKey = row.dataset.dragKey || '';
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedKey);
      }
    });

    contentEl.addEventListener('dragend', () => {
      draggedKey = '';
    });

    contentEl.addEventListener('dragover', (e) => {
      if (!state.isAdmin) return;
      const zone = e.target.closest('[data-gender-drop]');
      if (!draggedKey || !zone) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    });

    contentEl.addEventListener('drop', (e) => {
      if (!state.isAdmin) return;
      const zone = e.target.closest('[data-gender-drop]');
      if (!zone) return;
      e.preventDefault();
      const key = (e.dataTransfer?.getData('text/plain') || draggedKey || '').trim();
      const gender = zone.dataset.genderDrop;
      if (key && (gender === 'female' || gender === 'male')) {
        const item = state.comments.find(x => itemKey(x) === key);
        const beforeGender = item ? classifyGender(item) : '';
        if (item) setManualGenderForItem(item, gender);
        else state.manualGenderOverrides[key] = gender;
        if (beforeGender && beforeGender !== gender) state.newDraggedApplicants.add(key);
        saveManualGenderOverrides();
        if (item) syncGenderForItem(item, gender, true);
        else syncGenderOperation({ operation: 'set', keys: [key], gender, nickname: '', markNew: true });
        render();
      }
      draggedKey = '';
    });



    // 모바일 브라우저는 기본 HTML5 drag/drop 지원이 불안정하므로
    // 관리자 모드에서 길게 누른 뒤 손가락으로 옮기는 터치 드래그를 별도로 지원합니다.
    const touchDragState = {
      timer: null,
      active: false,
      key: '',
      startX: 0,
      startY: 0,
      x: 0,
      y: 0,
      sourceRow: null,
      targetZone: null,
      ghost: null
    };

    function clearTouchDragTimer() {
      if (touchDragState.timer) clearTimeout(touchDragState.timer);
      touchDragState.timer = null;
    }

    function clearTouchDropTarget() {
      if (touchDragState.targetZone) touchDragState.targetZone.classList.remove('touch-drop-target');
      touchDragState.targetZone = null;
    }

    function finishTouchDragVisuals() {
      clearTouchDragTimer();
      clearTouchDropTarget();
      touchDragState.sourceRow?.classList.remove('touch-drag-source');
      touchDragState.ghost?.remove();
      document.body.classList.remove('touch-dragging');
      touchDragState.active = false;
      touchDragState.key = '';
      touchDragState.sourceRow = null;
      touchDragState.ghost = null;
    }

    function positionTouchGhost(x, y) {
      if (!touchDragState.ghost) return;
      touchDragState.ghost.style.left = `${x}px`;
      touchDragState.ghost.style.top = `${y}px`;
    }

    function updateTouchDropTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      const zone = el?.closest?.('[data-gender-drop]') || null;
      if (zone === touchDragState.targetZone) return zone;
      clearTouchDropTarget();
      if (zone) {
        zone.classList.add('touch-drop-target');
        touchDragState.targetZone = zone;
      }
      return zone;
    }

    function applyMobileGenderDrop(key, gender) {
      if (!state.isAdmin || !key || (gender !== 'female' && gender !== 'male')) return;
      const item = state.comments.find(x => itemKey(x) === key);
      const beforeGender = item ? classifyGender(item) : '';
      const actuallyMoved = Boolean(beforeGender && beforeGender !== gender);

      if (item) setManualGenderForItem(item, gender);
      else state.manualGenderOverrides[key] = gender;

      if (actuallyMoved) state.newDraggedApplicants.add(key);
      saveManualGenderOverrides();

      if (item) syncGenderForItem(item, gender, actuallyMoved);
      else syncGenderOperation({ operation: 'set', keys: [key], gender, nickname: '', markNew: actuallyMoved });
      render();
    }

    contentEl.addEventListener('touchstart', (e) => {
      if (!state.isAdmin || e.touches.length !== 1) return;
      if (e.target.closest('button')) return;
      const row = e.target.closest('[data-drag-key]');
      if (!row) return;

      const t = e.touches[0];
      finishTouchDragVisuals();
      touchDragState.key = row.dataset.dragKey || '';
      touchDragState.startX = touchDragState.x = t.clientX;
      touchDragState.startY = touchDragState.y = t.clientY;
      touchDragState.sourceRow = row;

      touchDragState.timer = setTimeout(() => {
        if (!touchDragState.key || !touchDragState.sourceRow) return;
        touchDragState.active = true;
        touchDragState.sourceRow.classList.add('touch-drag-source');
        document.body.classList.add('touch-dragging');

        const ghost = document.createElement('div');
        ghost.className = 'touch-drag-ghost';
        ghost.textContent = touchDragState.sourceRow.querySelector('.name-link')?.textContent?.trim() || '신청자 이동';
        document.body.appendChild(ghost);
        touchDragState.ghost = ghost;
        positionTouchGhost(touchDragState.x, touchDragState.y);
        updateTouchDropTarget(touchDragState.x, touchDragState.y);
        if (navigator.vibrate) navigator.vibrate(25);
      }, 480);
    }, { passive: true });

    contentEl.addEventListener('touchmove', (e) => {
      if (!touchDragState.key || e.touches.length !== 1) return;
      const t = e.touches[0];
      touchDragState.x = t.clientX;
      touchDragState.y = t.clientY;

      if (!touchDragState.active) {
        const dx = t.clientX - touchDragState.startX;
        const dy = t.clientY - touchDragState.startY;
        if (Math.hypot(dx, dy) > 10) finishTouchDragVisuals();
        return;
      }

      e.preventDefault();
      positionTouchGhost(t.clientX, t.clientY);
      updateTouchDropTarget(t.clientX, t.clientY);

      // 긴 목록에서도 손가락을 화면 위/아래 가장자리로 가져가면 천천히 스크롤합니다.
      if (t.clientY < 72) window.scrollBy(0, -18);
      else if (t.clientY > window.innerHeight - 72) window.scrollBy(0, 18);
    }, { passive: false });

    contentEl.addEventListener('touchend', (e) => {
      if (!touchDragState.key) return;
      clearTouchDragTimer();
      if (!touchDragState.active) {
        finishTouchDragVisuals();
        return;
      }

      e.preventDefault();
      const t = e.changedTouches?.[0];
      const zone = t ? updateTouchDropTarget(t.clientX, t.clientY) : touchDragState.targetZone;
      const key = touchDragState.key;
      const gender = zone?.dataset?.genderDrop || '';
      finishTouchDragVisuals();
      if (gender === 'female' || gender === 'male') applyMobileGenderDrop(key, gender);
    }, { passive: false });

    contentEl.addEventListener('touchcancel', () => finishTouchDragVisuals(), { passive: true });

    contentEl.addEventListener('contextmenu', (e) => {
      if (state.isAdmin && window.matchMedia?.('(pointer: coarse)')?.matches && e.target.closest('[data-drag-key]')) {
        e.preventDefault();
      }
    });


    adminBtn.addEventListener('click', () => {
      if (state.isAdmin) setAdminMode(false);
      else openAdminModal();
    });
    $('#adminCancelBtn').addEventListener('click', closeAdminModal);
    $('#adminSubmitBtn').addEventListener('click', submitAdminCode);
    adminCodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAdminCode();
      if (e.key === 'Escape') closeAdminModal();
    });
    adminModal.addEventListener('click', (e) => {
      if (e.target === adminModal) closeAdminModal();
    });

    updateDeadlineCountdown();
    setInterval(updateDeadlineCountdown, 1000);

    window.addEventListener('pagehide', () => dismissCurrentNewBadges(false));
    // Edge 등에서 뒤로가기로 이전 화면 캐시가 복원되면 최신 데이터를 다시 불러옵니다.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) window.location.reload();
    });

    state.isAdmin = loadAdminSession();
    state.adminCode = loadAdminCodeSession();
    if (state.isAdmin && !state.adminCode) state.isAdmin = false;
    updateAdminUi();
    state.manualGenderOverrides = loadManualGenderOverrides();
    loadCloudGenderOverrides();
    if (state.isAdmin) syncAllLocalOverridesToCloud();
    loadComments();

    // 페이지가 열려 있는 동안에도 좋아요/신규 댓글을 주기적으로 다시 확인합니다.
    setInterval(() => {
      if (!document.hidden && !state.loading) {
        loadComments({ silent: true });
        loadCloudGenderOverrides();
      }
    }, 60_000);
  </script>
</body>
</html>
